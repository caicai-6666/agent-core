[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-core"
version = "0.1.0"
description = "Task-tree agent runtime with durable memory, hybrid retrieval and extensible providers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "openai>=1.70,<3", "httpx>=0.27,<1", "langgraph>=1,<2", "typing-extensions>=4.12"]

[project.urls]
Repository = "https://github.com/caicai-6666/agent-core"
Documentation = "https://github.com/caicai-6666/agent-core/blob/main/description/readme.md"

[project.optional-dependencies]
mysql = ["asyncmy>=0.2.9,<0.3"]
pdf = ["pymupdf>=1.25,<2", "Pillow>=10"]

test = ["pytest>=8", "pytest-asyncio>=0.24", "build>=1", "pymupdf>=1.25,<2", "Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_core = ["assets/tool-tag/*.txt", "py.typed", "adapters/schema/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--basetemp=tests/tmp/pytest"
testpaths = ["tests"]

[tool.setuptools.cmdclass]
build_py = "build_support.BuildPy"
